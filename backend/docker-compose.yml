services:
  postgres:
    image: postgres:15-alpine
    container_name: naissancechain-db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password123}
      POSTGRES_DB: ${DATABASE_NAME:-naissancechain_db}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-admin} -d ${DATABASE_NAME:-naissancechain_db}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
