version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: naissancechain-db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password123}
      POSTGRES_DB: ${DATABASE_NAME:-naissancechain_db}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
