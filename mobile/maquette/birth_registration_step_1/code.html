<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #f4fbf6;
        }
        .glass-header {
            background-color: rgba(247, 249, 251, 0.9);
            backdrop-filter: blur(20px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#304d39",
                        "on-secondary": "#ffffff",
                        "surface-container": "#e9f0ea",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#59de9b",
                        "on-secondary-container": "#496758",
                        "surface-bright": "#f4fbf6",
                        "surface-tint": "#006d43",
                        "tertiary": "#47654f",
                        "on-secondary-fixed-variant": "#2f4d3f",
                        "on-tertiary-fixed": "#032110",
                        "on-primary-fixed": "#002111",
                        "on-background": "#161d1a",
                        "surface-container-high": "#e3eae5",
                        "outline-variant": "#bccabe",
                        "on-surface": "#161d1a",
                        "tertiary-container": "#7b9b83",
                        "on-secondary-fixed": "#022115",
                        "primary-fixed-dim": "#59de9b",
                        "secondary-container": "#c3e5d2",
                        "primary-fixed": "#78fbb6",
                        "on-surface-variant": "#3d4a41",
                        "surface-container-low": "#eff5f0",
                        "on-tertiary": "#ffffff",
                        "primary": "#006d43",
                        "tertiary-fixed-dim": "#adcfb4",
                        "surface-dim": "#d5dcd7",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2b322f",
                        "surface-variant": "#dde4df",
                        "secondary": "#466556",
                        "secondary-fixed": "#c8ead7",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#ecf2ed",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#005232",
                        "on-tertiary-container": "#153220",
                        "secondary-fixed-dim": "#adcebc",
                        "tertiary-fixed": "#c9ebcf",
                        "on-primary-container": "#00331d",
                        "surface-container-highest": "#dde4df",
                        "surface": "#f4fbf6",
                        "outline": "#6d7a70",
                        "background": "#f4fbf6",
                        "primary-container": "#00a86b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-[#f7f9fb]/90 backdrop-blur-xl shadow-sm">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="account_balance">account_balance</span>
<span class="text-emerald-900 font-extrabold tracking-tighter text-lg">NaissanceChain</span>
</div>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-emerald-50 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-slate-500" data-icon="notifications">notifications</span>
</button>
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-xs">
                    JD
                </div>
</div>
</div>
</header>
<main class="max-w-2xl mx-auto px-6 pt-12">
<!-- Progress Indicator -->
<div class="mb-12">
<div class="flex justify-between items-center mb-6">
<div>
<span class="text-xs font-bold uppercase tracking-[0.15em] text-primary mb-1 block">Étape 1 sur 3</span>
<h1 class="text-3xl font-extrabold tracking-tight text-on-background">Informations de l'Enfant</h1>
</div>
<div class="h-14 w-14 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="text-primary font-bold text-lg">33%</span>
</div>
</div>
<div class="flex gap-2 h-1.5 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-primary rounded-full transition-all duration-500"></div>
<div class="h-full w-1/3 bg-surface-variant/30"></div>
<div class="h-full w-1/3 bg-surface-variant/30"></div>
</div>
</div>
<!-- Form Section -->
<section class="space-y-10">
<!-- Identity Group -->
<div class="bg-surface-container-low rounded-[2rem] p-8 shadow-sm">
<div class="flex items-center gap-3 mb-8">
<span class="material-symbols-outlined text-primary-container" data-icon="child_care">child_care</span>
<h2 class="text-xl font-bold tracking-tight">Identité Civile</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="text-[11px] font-bold uppercase tracking-widest text-on-surface-variant ml-1">Prénom(s)</label>
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-outline-variant" placeholder="Entrez les prénoms" type="text"/>
</div>
<div class="space-y-2">
<label class="text-[11px] font-bold uppercase tracking-widest text-on-surface-variant ml-1">Nom de Famille</label>
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-outline-variant" placeholder="Entrez le nom" type="text"/>
</div>
</div>
<!-- Sex Segmented Control -->
<div class="mt-8 space-y-3">
<label class="text-[11px] font-bold uppercase tracking-widest text-on-surface-variant ml-1">Sexe</label>
<div class="grid grid-cols-2 gap-3 p-1.5 bg-surface-container-highest rounded-2xl">
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-white text-primary font-bold shadow-sm transition-all duration-200">
<span class="material-symbols-outlined text-xl" data-icon="male">male</span>
<span>Masculin</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-on-surface-variant font-semibold hover:bg-white/50 transition-all duration-200">
<span class="material-symbols-outlined text-xl" data-icon="female">female</span>
<span>Féminin</span>
</button>
</div>
</div>
</div>
<!-- Birth Details Group -->
<div class="bg-surface-container-low rounded-[2rem] p-8 shadow-sm">
<div class="flex items-center gap-3 mb-8">
<span class="material-symbols-outlined text-primary-container" data-icon="event">event</span>
<h2 class="text-xl font-bold tracking-tight">Détails de Naissance</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="text-[11px] font-bold uppercase tracking-widest text-on-surface-variant ml-1">Date de Naissance</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-on-surface appearance-none" type="date"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<div class="space-y-2">
<label class="text-[11px] font-bold uppercase tracking-widest text-on-surface-variant ml-1">Heure de Naissance</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-on-surface appearance-none" type="time"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none" data-icon="schedule">schedule</span>
</div>
</div>
</div>
<div class="mt-6 space-y-2">
<label class="text-[11px] font-bold uppercase tracking-widest text-on-surface-variant ml-1">Lieu de Naissance (Hôpital/Ville)</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-xl pl-12 pr-4 py-3.5 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-outline-variant" placeholder="Ex: Centre Hospitalier de Donka, Conakry" type="text"/>
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-primary/60" data-icon="location_on">location_on</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-6 flex flex-col gap-4">
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-white font-bold rounded-2xl shadow-lg hover:shadow-primary/20 transition-all active:scale-95 duration-200 flex items-center justify-center gap-2">
<span>Continuer vers l'Étape 2</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full py-4 text-on-surface-variant font-bold hover:bg-surface-container rounded-2xl transition-all">
                    Sauvegarder en brouillon
                </button>
</div>
</section>
</main>
<!-- BottomNavBar (Visible on Mobile) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-white/85 backdrop-blur-2xl shadow-[0_-12px_32px_rgba(0,52,109,0.04)] rounded-t-[2rem] md:hidden">
<div class="flex flex-col items-center justify-center text-slate-400 px-5 py-2.5 hover:bg-emerald-50 transition-colors">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-manrope text-[11px] font-semibold uppercase tracking-widest mt-1">Accueil</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-5 py-2.5 hover:bg-emerald-50 transition-colors">
<span class="material-symbols-outlined" data-icon="family_restroom">family_restroom</span>
<span class="font-manrope text-[11px] font-semibold uppercase tracking-widest mt-1">Famille</span>
</div>
<div class="flex flex-col items-center justify-center bg-emerald-100/80 text-emerald-900 rounded-2xl px-5 py-2.5 transition-all">
<span class="material-symbols-outlined" data-icon="grid_view" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<span class="font-manrope text-[11px] font-semibold uppercase tracking-widest mt-1">Services</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-5 py-2.5 hover:bg-emerald-50 transition-colors">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-manrope text-[11px] font-semibold uppercase tracking-widest mt-1">Profil</span>
</div>
</nav>
</body></html>
