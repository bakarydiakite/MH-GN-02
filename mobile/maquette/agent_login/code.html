<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed-variant": "#304d39",
                    "on-secondary": "#ffffff",
                    "surface-container": "#e9f0ea",
                    "error-container": "#ffdad6",
                    "inverse-primary": "#59de9b",
                    "on-secondary-container": "#496758",
                    "surface-bright": "#f4fbf6",
                    "surface-tint": "#006d43",
                    "tertiary": "#47654f",
                    "on-secondary-fixed-variant": "#2f4d3f",
                    "on-tertiary-fixed": "#032110",
                    "on-primary-fixed": "#002111",
                    "on-background": "#161d1a",
                    "surface-container-high": "#e3eae5",
                    "outline-variant": "#bccabe",
                    "on-surface": "#161d1a",
                    "tertiary-container": "#7b9b83",
                    "on-secondary-fixed": "#022115",
                    "primary-fixed-dim": "#59de9b",
                    "secondary-container": "#c3e5d2",
                    "primary-fixed": "#78fbb6",
                    "on-surface-variant": "#3d4a41",
                    "surface-container-low": "#eff5f0",
                    "on-tertiary": "#ffffff",
                    "primary": "#006d43",
                    "tertiary-fixed-dim": "#adcfb4",
                    "surface-dim": "#d5dcd7",
                    "on-primary": "#ffffff",
                    "inverse-surface": "#2b322f",
                    "surface-variant": "#dde4df",
                    "secondary": "#466556",
                    "secondary-fixed": "#c8ead7",
                    "on-error-container": "#93000a",
                    "inverse-on-surface": "#ecf2ed",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "error": "#ba1a1a",
                    "on-primary-fixed-variant": "#005232",
                    "on-tertiary-container": "#153220",
                    "secondary-fixed-dim": "#adcebc",
                    "tertiary-fixed": "#c9ebcf",
                    "on-primary-container": "#00331d",
                    "surface-container-highest": "#dde4df",
                    "surface": "#f4fbf6",
                    "outline": "#6d7a70",
                    "background": "#f4fbf6",
                    "primary-container": "#00a86b"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-glass {
            background: rgba(244, 251, 246, 0.7);
            backdrop-filter: blur(20px);
        }
        .sovereign-gradient {
            background: linear-gradient(135deg, #006d43 0%, #00a86b 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar as defined in JSON but adapted for non-nav state (simplified) -->
<header class="w-full sticky top-0 z-50 bg-[#f7f9fb]/90 backdrop-blur-xl shadow-sm flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 sovereign-gradient rounded-xl flex items-center justify-center text-white shadow-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="text-emerald-900 font-extrabold tracking-tighter font-manrope text-lg">NaissanceChain</h1>
</div>
<div class="flex items-center gap-2 text-slate-500">
<span class="text-[10px] font-bold uppercase tracking-widest bg-surface-container-high px-3 py-1 rounded-full">Portail Agent</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-6 relative overflow-hidden">
<!-- Abstract Background Decoration -->
<div class="absolute top-[-10%] right-[-10%] w-[40rem] h-[40rem] bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-secondary-container/20 rounded-full blur-3xl"></div>
<div class="w-full max-w-md z-10">
<!-- Central Branding/Seal -->
<div class="text-center mb-10">
<div class="inline-block p-4 rounded-full bg-surface-container-low mb-6 border border-outline-variant/10">
<img class="w-24 h-24 object-contain opacity-90" data-alt="Official government seal of Guinea with coat of arms, rendered in high-detail emerald and gold metallic textures" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAL7W6RTHJXM8K43U4bQrpd4M36uuad01x85MB_EXFMm-z4ABBAApe9MQ8SPzxmOvtpbmYruYApZ_IwahJoC-rg7RJp6xttOLDyMJnk50-9Rrw95VL1jMlcOjngINUmM9Ozohdg3gdIu6fo8I9xppHmlTrVi1ov48KyTSOoV18yfLzQ6JC-iqhrvecEaxEt9ygOwu9G2xXNt1H2MtydWAhVeN7JHaWeTGd88WkUGwKgm0ane5EBtLvSKPdjZWNvdaKaA6EtV1AkwOo"/>
</div>
<h2 class="text-3xl font-headline font-extrabold text-on-surface tracking-tight mb-2">Authentification Sécurisée</h2>
<p class="text-on-surface-variant font-body text-sm leading-relaxed max-w-[280px] mx-auto">
                    Accédez au registre national souverain de la République de Guinée.
                </p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest p-8 rounded-[2rem] shadow-[0_12px_32px_-4px_rgba(22,29,26,0.08)]">
<form class="space-y-6">
<!-- Identifier Field -->
<div class="space-y-2">
<label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant ml-2">Identifiant Agent</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-highest border-0 rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all font-body text-on-surface placeholder:text-outline" placeholder="ex: AG-224-XXXX" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant ml-2">Mot de passe</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-highest border-0 rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all font-body text-on-surface placeholder:text-outline" placeholder="••••••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full sovereign-gradient text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Se connecter</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Quick Access / Biometrics -->
<div class="mt-10">
<div class="flex items-center gap-4 mb-6">
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
<span class="text-[10px] font-bold uppercase tracking-widest text-outline">Accès Rapide</span>
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-3 bg-surface-container-low hover:bg-surface-container transition-colors rounded-xl border border-outline-variant/10 group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">fingerprint</span>
<span class="text-xs font-bold text-on-surface-variant">Biométrie</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 bg-surface-container-low hover:bg-surface-container transition-colors rounded-xl border border-outline-variant/10 group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">dialpad</span>
<span class="text-xs font-bold text-on-surface-variant">Code PIN</span>
</button>
</div>
</div>
</div>
<!-- Footer Info -->
<div class="mt-12 text-center space-y-4">
<a class="text-xs font-bold text-primary hover:underline underline-offset-4 decoration-2" href="#">Problème de connexion ?</a>
<p class="text-[10px] text-outline uppercase tracking-tighter">
                    Système de gestion d'état civil — Ministère de l'Administration du Territoire
                </p>
</div>
</div>
</main>
<!-- Bottom security bar (Floating context) -->
<footer class="p-6 text-center">
<div class="inline-flex items-center gap-2 px-4 py-2 bg-emerald-50 rounded-full">
<span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
<span class="text-[10px] font-bold text-emerald-800 uppercase tracking-widest">Connexion chiffrée AES-256</span>
</div>
</footer>
</body></html>
